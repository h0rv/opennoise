verify-phase3-release-manifest = "python scripts/verify_phase3_release_manifest.py"
ui-qa = "python scripts/render_ui_qa.py"
open-v2-qa = "python scripts/qa_open_construction_v2.py"
evaluate-production-map = "python scripts/evaluate_production_map.py"
build-historical-compatibility = "python scripts/build_historical_compatibility.py"
evaluate-historical-compatibility = "python scripts/evaluate_historical_compatibility.py"
build-historical-signal-model = "python scripts/build_historical_signal_model.py"
custody-historical-inputs = "python scripts/custody_historical_inputs.py --h3-source $OPENNOISE_HISTORICAL_H3_SOURCE --membership-database $OPENNOISE_HISTORICAL_MEMBERSHIP_DATABASE --object-store $OPENNOISE_HISTORICAL_OBJECT_STORE --receipt $OPENNOISE_HISTORICAL_CUSTODY_RECEIPT --h2-manifest $OPENNOISE_HISTORICAL_MANIFEST"
audit-historical-signal = "python scripts/audit_historical_signal.py"
publish-historical-signal-map = "python scripts/publish_historical_signal_map.py"
evaluate-historical-hierarchy = "python scripts/evaluate_historical_hierarchy.py"
evaluate-historical-hierarchy-gate = "python scripts/evaluate_historical_hierarchy_release_gate.py"
build-metadata-representatives = "python scripts/build_metadata_representatives.py $OPENNOISE_PUBLIC_DATABASE --output $OPENNOISE_METADATA_REPRESENTATIVES_OUTPUT"
publish-metadata-representatives = "python scripts/publish_metadata_representatives.py $OPENNOISE_METADATA_REPRESENTATIVES_ARTIFACT --object-store $OPENNOISE_METADATA_REPRESENTATIVES_OBJECT_STORE --output $OPENNOISE_METADATA_REPRESENTATIVES_RECEIPT"
hydrate-musicbrainz-releases = "opennoise hydrate-musicbrainz-releases --representatives $OPENNOISE_METADATA_REPRESENTATIVES_ARTIFACT --output $OPENNOISE_MUSICBRAINZ_HYDRATION_OUTPUT --object-store $OPENNOISE_MUSICBRAINZ_HYDRATION_OBJECT_STORE --cache-directory $OPENNOISE_MUSICBRAINZ_HYDRATION_CACHE --user-agent $OPENNOISE_MUSICBRAINZ_USER_AGENT"
build-representative-catalog-candidates = "opennoise build-representative-catalog-candidates --database $OPENNOISE_REPRESENTATIVE_CATALOG_DATABASE --run-ref $OPENNOISE_REPRESENTATIVE_CATALOG_RUN_REF --policy-id $OPENNOISE_REPRESENTATIVE_CATALOG_POLICY_ID --generated-at $OPENNOISE_REPRESENTATIVE_CATALOG_GENERATED_AT --output $OPENNOISE_REPRESENTATIVE_CATALOG_OUTPUT --object-store $OPENNOISE_REPRESENTATIVE_CATALOG_OBJECT_STORE --report $OPENNOISE_REPRESENTATIVE_CATALOG_REPORT"
build-artist-backed-release-expansion = "python scripts/build_artist_backed_release_expansion.py --source-database $OPENNOISE_ARTIST_BACKED_RELEASE_SOURCE_DATABASE --database $OPENNOISE_ARTIST_BACKED_RELEASE_DATABASE --output $OPENNOISE_ARTIST_BACKED_RELEASE_OUTPUT --object-store $OPENNOISE_ARTIST_BACKED_RELEASE_OBJECT_STORE --cache-directory $OPENNOISE_ARTIST_BACKED_RELEASE_CACHE --report $OPENNOISE_ARTIST_BACKED_RELEASE_REPORT --user-agent $OPENNOISE_MUSICBRAINZ_USER_AGENT"
build-genre-seed-universe = "opennoise build-genre-seed-universe --seed-artifact $OPENNOISE_H2_SEED_ARTIFACT --catalog-database $OPENNOISE_PUBLIC_DATABASE --output $OPENNOISE_GENRE_SEED_UNIVERSE_OUTPUT"
build-genre-seed-public-taxonomy = "python scripts/build_genre_seed_public_taxonomy.py --seed-artifact $OPENNOISE_H2_SEED_ARTIFACT --public-catalog-database $OPENNOISE_PUBLIC_DATABASE --output $OPENNOISE_GENRE_SEED_PUBLIC_TAXONOMY_OUTPUT"
build-open-construction-graph = "opennoise build-open-construction-graph --seed-artifact $OPENNOISE_H2_SEED_ARTIFACT --taxonomy-artifact $OPENNOISE_GENRE_SEED_PUBLIC_TAXONOMY_OUTPUT --public-catalog-database $OPENNOISE_PUBLIC_DATABASE --output $OPENNOISE_OPEN_CONSTRUCTION_GRAPH_OUTPUT --object-store $OPENNOISE_OPEN_CONSTRUCTION_GRAPH_OBJECT_STORE --receipt $OPENNOISE_OPEN_CONSTRUCTION_GRAPH_RECEIPT --gate-report $OPENNOISE_OPEN_CONSTRUCTION_GRAPH_GATE"
build-public-taxonomy-expansion = "python scripts/build_public_taxonomy_expansion.py --taxonomy-artifact $OPENNOISE_GENRE_SEED_PUBLIC_TAXONOMY_OUTPUT --public-catalog-database $OPENNOISE_PUBLIC_DATABASE --output $OPENNOISE_PUBLIC_TAXONOMY_EXPANSION_OUTPUT --object-store $OPENNOISE_PUBLIC_TAXONOMY_EXPANSION_OBJECT_STORE --receipt $OPENNOISE_PUBLIC_TAXONOMY_EXPANSION_RECEIPT"
build-public-artist-membership-candidate = "python scripts/build_public_artist_membership_candidate.py --seed-artifact $OPENNOISE_H2_SEED_ARTIFACT --approved-input $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_APPROVED_INPUT --adapter-receipt $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_RECEIPT --certified-database $OPENNOISE_CERTIFIED_PUBLIC_DATABASE --adapter-policy $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_POLICY --source-policy $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_SOURCE_POLICY --output $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_OUTPUT --object-store $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_OBJECT_STORE --receipt $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_RECEIPT --promotion-policy $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_PROMOTION_POLICY --promotion-report $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_PROMOTION_REPORT"
adapt-public-artist-membership-input = "python scripts/adapt_public_artist_membership_input.py --database $OPENNOISE_CERTIFIED_PUBLIC_DATABASE --policy $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_POLICY --approved-input $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_APPROVED_INPUT --receipt $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_RECEIPT"
build-public-artist-membership-real-input = { sequence = ["adapt-public-artist-membership-input", "build-public-artist-membership-candidate"] }
evaluate-public-artist-membership-historical = "python scripts/evaluate_public_artist_membership_historical.py --candidate $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_OUTPUT --approved-input $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_APPROVED_INPUT --public-database $OPENNOISE_CERTIFIED_PUBLIC_DATABASE --historical-database $OPENNOISE_HISTORICAL_MEMBERSHIP_DATABASE --report $OPENNOISE_PUBLIC_ARTIST_MEMBERSHIP_HISTORICAL_REPORT"
build-open-construction-graph-v2 = "python scripts/build_open_construction_graph_v2.py --taxonomy-expansion $OPENNOISE_PUBLIC_TAXONOMY_EXPANSION_OUTPUT --output $OPENNOISE_OPEN_CONSTRUCTION_GRAPH_V2_OUTPUT --object-store $OPENNOISE_OPEN_CONSTRUCTION_GRAPH_V2_OBJECT_STORE --receipt $OPENNOISE_OPEN_CONSTRUCTION_GRAPH_V2_RECEIPT"

[tool.poe.tasks.historical-signal-release]
sequence = [
    { cmd = "python scripts/build_historical_signal_model.py --historical-manifest $OPENNOISE_HISTORICAL_MANIFEST --membership-database $OPENNOISE_HISTORICAL_MEMBERSHIP_DATABASE --h3-artifact-sha256 $OPENNOISE_HISTORICAL_H3_ARTIFACT_SHA256 --output $OPENNOISE_HISTORICAL_SIGNAL_ARTIFACT --report $OPENNOISE_HISTORICAL_SIGNAL_BUILD_REPORT" },
    { cmd = "python scripts/publish_historical_signal_map.py --signal-artifact $OPENNOISE_HISTORICAL_SIGNAL_ARTIFACT --compatibility-receipt $OPENNOISE_HISTORICAL_COMPATIBILITY_RECEIPT --output $OPENNOISE_HISTORICAL_SIGNAL_PUBLICATION --object-store $OPENNOISE_HISTORICAL_OBJECT_STORE --receipt $OPENNOISE_HISTORICAL_SIGNAL_RECEIPT --report $OPENNOISE_HISTORICAL_SIGNAL_PUBLISH_REPORT" },
]

[tool.poe.tasks.build-public-release]
sequence = [
    { cmd = "python scripts/build_public_release.py" },
    { cmd = "python scripts/build_production_map.py --database data/public.sqlite --source-model data/model/phase3-public-model.json --output data/model/production-map-v1.json" },
]


[tool.poe.tasks.release-certify]
cmd = "python scripts/release_certify.py"

[tool.poe.tasks.public-release-custody]
cmd = "python scripts/custody_public_release.py"

[tool.poe.tasks.public-release-bundle]
cmd = "python scripts/public_release_bundle.py"

[tool.poe.tasks.check]
sequence = ["format-check", "lint", "typecheck", "test", "schema"]
