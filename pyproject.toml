hydrate-musicbrainz-releases = "musix hydrate-musicbrainz-releases --representatives $MUSIX_METADATA_REPRESENTATIVES_ARTIFACT --output $MUSIX_MUSICBRAINZ_HYDRATION_OUTPUT --object-store $MUSIX_MUSICBRAINZ_HYDRATION_OBJECT_STORE --cache-directory $MUSIX_MUSICBRAINZ_HYDRATION_CACHE --user-agent $MUSIX_MUSICBRAINZ_USER_AGENT"
build-representative-catalog-candidates = "musix build-representative-catalog-candidates --database $MUSIX_REPRESENTATIVE_CATALOG_DATABASE --run-ref $MUSIX_REPRESENTATIVE_CATALOG_RUN_REF --policy-id $MUSIX_REPRESENTATIVE_CATALOG_POLICY_ID --generated-at $MUSIX_REPRESENTATIVE_CATALOG_GENERATED_AT --output $MUSIX_REPRESENTATIVE_CATALOG_OUTPUT --object-store $MUSIX_REPRESENTATIVE_CATALOG_OBJECT_STORE --report $MUSIX_REPRESENTATIVE_CATALOG_REPORT"
build-artist-backed-release-expansion = "python scripts/build_artist_backed_release_expansion.py --source-database $MUSIX_ARTIST_BACKED_RELEASE_SOURCE_DATABASE --database $MUSIX_ARTIST_BACKED_RELEASE_DATABASE --output $MUSIX_ARTIST_BACKED_RELEASE_OUTPUT --object-store $MUSIX_ARTIST_BACKED_RELEASE_OBJECT_STORE --cache-directory $MUSIX_ARTIST_BACKED_RELEASE_CACHE --report $MUSIX_ARTIST_BACKED_RELEASE_REPORT --user-agent $MUSIX_MUSICBRAINZ_USER_AGENT"
build-genre-seed-universe = "musix build-genre-seed-universe --seed-artifact $MUSIX_H2_SEED_ARTIFACT --catalog-database $MUSIX_PUBLIC_DATABASE --output $MUSIX_GENRE_SEED_UNIVERSE_OUTPUT"
build-genre-seed-public-taxonomy = "python scripts/build_genre_seed_public_taxonomy.py --seed-artifact $MUSIX_H2_SEED_ARTIFACT --public-catalog-database $MUSIX_PUBLIC_DATABASE --output $MUSIX_GENRE_SEED_PUBLIC_TAXONOMY_OUTPUT"
build-open-construction-graph = "musix build-open-construction-graph --seed-artifact $MUSIX_H2_SEED_ARTIFACT --taxonomy-artifact $MUSIX_GENRE_SEED_PUBLIC_TAXONOMY_OUTPUT --public-catalog-database $MUSIX_PUBLIC_DATABASE --output $MUSIX_OPEN_CONSTRUCTION_GRAPH_OUTPUT --object-store $MUSIX_OPEN_CONSTRUCTION_GRAPH_OBJECT_STORE --receipt $MUSIX_OPEN_CONSTRUCTION_GRAPH_RECEIPT --gate-report $MUSIX_OPEN_CONSTRUCTION_GRAPH_GATE"
build-public-taxonomy-expansion = "python scripts/build_public_taxonomy_expansion.py --taxonomy-artifact $MUSIX_GENRE_SEED_PUBLIC_TAXONOMY_OUTPUT --public-catalog-database $MUSIX_PUBLIC_DATABASE --output $MUSIX_PUBLIC_TAXONOMY_EXPANSION_OUTPUT --object-store $MUSIX_PUBLIC_TAXONOMY_EXPANSION_OBJECT_STORE --receipt $MUSIX_PUBLIC_TAXONOMY_EXPANSION_RECEIPT"
build-public-artist-membership-candidate = "python scripts/build_public_artist_membership_candidate.py --seed-artifact $MUSIX_H2_SEED_ARTIFACT --approved-input $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_APPROVED_INPUT --adapter-receipt $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_RECEIPT --certified-database $MUSIX_CERTIFIED_PUBLIC_DATABASE --adapter-policy $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_POLICY --source-policy $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_SOURCE_POLICY --output $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_OUTPUT --object-store $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_OBJECT_STORE --receipt $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_RECEIPT --promotion-policy $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_PROMOTION_POLICY --promotion-report $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_PROMOTION_REPORT"
adapt-public-artist-membership-input = "python scripts/adapt_public_artist_membership_input.py --database $MUSIX_CERTIFIED_PUBLIC_DATABASE --policy $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_POLICY --approved-input $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_APPROVED_INPUT --receipt $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_ADAPTER_RECEIPT"
build-public-artist-membership-real-input = { sequence = ["adapt-public-artist-membership-input", "build-public-artist-membership-candidate"] }
evaluate-public-artist-membership-historical = "python scripts/evaluate_public_artist_membership_historical.py --candidate $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_OUTPUT --approved-input $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_APPROVED_INPUT --public-database $MUSIX_CERTIFIED_PUBLIC_DATABASE --historical-database $MUSIX_HISTORICAL_MEMBERSHIP_DATABASE --report $MUSIX_PUBLIC_ARTIST_MEMBERSHIP_HISTORICAL_REPORT"
build-open-construction-graph-v2 = "python scripts/build_open_construction_graph_v2.py --taxonomy-expansion $MUSIX_PUBLIC_TAXONOMY_EXPANSION_OUTPUT --output $MUSIX_OPEN_CONSTRUCTION_GRAPH_V2_OUTPUT --object-store $MUSIX_OPEN_CONSTRUCTION_GRAPH_V2_OBJECT_STORE --receipt $MUSIX_OPEN_CONSTRUCTION_GRAPH_V2_RECEIPT"

[tool.poe.tasks.historical-signal-release]
sequence = [
    { cmd = "python scripts/build_historical_signal_model.py --historical-manifest $MUSIX_HISTORICAL_MANIFEST --membership-database $MUSIX_HISTORICAL_MEMBERSHIP_DATABASE --h3-artifact-sha256 $MUSIX_HISTORICAL_H3_ARTIFACT_SHA256 --output $MUSIX_HISTORICAL_SIGNAL_ARTIFACT --report $MUSIX_HISTORICAL_SIGNAL_BUILD_REPORT" },
    { cmd = "python scripts/publish_historical_signal_map.py --signal-artifact $MUSIX_HISTORICAL_SIGNAL_ARTIFACT --compatibility-receipt $MUSIX_HISTORICAL_COMPATIBILITY_RECEIPT --output $MUSIX_HISTORICAL_SIGNAL_PUBLICATION --object-store $MUSIX_HISTORICAL_OBJECT_STORE --receipt $MUSIX_HISTORICAL_SIGNAL_RECEIPT --report $MUSIX_HISTORICAL_SIGNAL_PUBLISH_REPORT" },
]

[tool.poe.tasks.build-public-release]
sequence = [
    { cmd = "python scripts/build_public_release.py" },
    { cmd = "python scripts/build_production_map.py --database data/public.sqlite --source-model data/model/phase3-public-model.json --output data/model/production-map-v1.json" },
]


[tool.poe.tasks.release-certify]
cmd = "python scripts/release_certify.py"

[tool.poe.tasks.public-release-custody]
cmd = "python scripts/custody_public_release.py"

[tool.poe.tasks.public-release-bundle]
cmd = "python scripts/public_release_bundle.py"

[tool.poe.tasks.check]
sequence = ["format-check", "lint", "typecheck", "test", "schema"]
