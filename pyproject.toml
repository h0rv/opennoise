[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[project]
name = "musix"
version = "0.1.0"
description = "A local map of music genres and artists"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "jinja2==3.1.6",
    "litestar==2.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "uvicorn==0.52.4",
    "zstandard>=0.25.0",
]

[project.scripts]
musix = "musix.cli:main"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "ruff",
    "ty",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Ruff formatter controls trailing commas.
    "CPY001", # This personal project has no required copyright header.
    "D203",   # Incompatible with D211.
    "D213",   # Incompatible with D212.
    "EM101",  # Typed boundary errors keep their local, specific messages.
    "EM102",  # Typed boundary errors keep their local, specific messages.
    "ISC001", # Ruff formatter can conflict with this rule.
    "TRY003", # Boundary context belongs at the raise site, not in generic exception classes.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D100", # Test module names describe their scope.
    "D101", # Test case names describe their scope.
    "D102", # Test method names describe behavior.
    "PT009", # The project deliberately uses stdlib unittest, not pytest.
    "PT027", # The project deliberately uses stdlib unittest, not pytest.
    "S101", # Assertions are the test contract.
]
"src/musix/routes.py" = [
    "PLR0913", # Route signatures list the public query parameters explicitly.
    "PLR0917", # Litestar injects route parameters by name rather than positional calls.
]
"src/musix/historical_signal_model.py" = [
    "C901", # Numerical evaluation and sparse component assembly are intentionally cohesive.
    "PLR0915", # The evaluator keeps every oracle-only calculation in one auditable boundary.
]
"src/musix/musicbrainz_release_group_evidence.py" = [
    "A001", # Raw MusicBrainz artist-credit payload is named by its source field.
    "D101", # Evidence schema field names make the small models self-describing.
    "D103", # Hash helper is intentionally a direct companion to the receipt model.
    "E501", # SQL and source-provenance strings are kept intact for auditability.
    "PLR0913", # The build boundary receives its explicit sealed inputs.
    "PLR0917", # The build boundary receives its explicit sealed inputs.
    "PLR2004", # The SQLite batch size is an intentional local implementation detail.
    "TC001", # Runtime Pydantic annotations require these model imports.
    "TC003", # Iterator is part of the runtime generator signature.
    "TRY004", # Malformed external JSON is one normal parse failure class.
    "TRY301", # The bounded parser keeps rejection immediately beside the check.
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.poe.tasks]
sync = "uv sync --locked"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "ty check"
"prepare-test-runtime" = "mkdir -p .cache/test-tmp .cache/uv"
test = { sequence = [
    "prepare-test-runtime",
    { cmd = "python -m unittest discover -s tests -v", env = { TMPDIR = ".cache/test-tmp", UV_CACHE_DIR = ".cache/uv" } },
] }
schema = "python -m unittest tests.test_schema -v"
"import" = "musix ingest"
bootstrap = "musix bootstrap-everynoise"
source-cache-status = "musix source-cache-status $MUSIX_SOURCE_CACHE_SOURCE_IDS"
acquire-source-cache = "musix acquire-source-cache $MUSIX_SOURCE_CACHE_SOURCE_IDS --object-store $MUSIX_SOURCE_CACHE_OBJECT_STORE --work-directory $MUSIX_SOURCE_CACHE_WORK_DIRECTORY --receipt $MUSIX_SOURCE_CACHE_RECEIPT"
cache-musicbrainz-release-group-20260905 = "musix acquire-source-cache musicbrainz_json_release_group_research_20260905 --object-store $MUSIX_MB_RELEASE_GROUP_CACHE_OBJECT_STORE --work-directory $MUSIX_MB_RELEASE_GROUP_CACHE_WORK_DIRECTORY --receipt $MUSIX_MB_RELEASE_GROUP_CACHE_RECEIPT --max-sources 1 --max-total-bytes 1200000000 --max-concurrency 1 --timeout-seconds 3600"
restore-source-cache = "musix restore-source-cache $MUSIX_SOURCE_CACHE_SOURCE_IDS --object-store $MUSIX_SOURCE_CACHE_OBJECT_STORE --receipt $MUSIX_SOURCE_CACHE_RECEIPT --destination $MUSIX_SOURCE_CACHE_DESTINATION"
dev = "python scripts/run_dev.py"
dev-research = "python scripts/run_local_research_dev.py"
dev-legacy = "musix serve"
evaluate-layout = "python scripts/evaluate_layout.py data/musix.sqlite --layout default"
evaluate-membership = "python scripts/evaluate_membership.py tests/fixtures/membership_evaluation.json"
evaluate-artist-memberships = "python scripts/evaluate_artist_memberships.py $MUSIX_PUBLIC_MODEL_ARTIFACT --judgments $MUSIX_ARTIST_MEMBERSHIP_JUDGMENTS --report $MUSIX_ARTIST_MEMBERSHIP_EVALUATION_REPORT --database $MUSIX_ARTIST_MEMBERSHIP_EVALUATION_DATABASE --object-store $MUSIX_ARTIST_MEMBERSHIP_EVALUATION_OBJECT_STORE"
evaluate-public-memberships-externally = "python scripts/evaluate_public_memberships_externally.py --public-database $MUSIX_CERTIFIED_PUBLIC_DATABASE --musicbrainz-research-database $MUSIX_MUSICBRAINZ_RESEARCH_DATABASE --report $MUSIX_PUBLIC_MEMBERSHIP_EXTERNAL_EVALUATION_REPORT"
ingest-musicbrainz-artists = "musix ingest-source musicbrainz_json_artist_20260829 --partition-prefix 0 --max-record-bytes 67108864"
ingest-musicbrainz-research = "musix ingest-source musicbrainz_json_artist_research_20260829 --partition-prefix 0 --max-record-bytes 67108864"
evaluate-musicbrainz-coverage = "python scripts/evaluate_musicbrainz_coverage.py --research-database $MUSIX_MB_RESEARCH_DATABASE --seed-database $MUSIX_SEED_DATABASE --source-key $MUSIX_MB_SOURCE_KEY --report $MUSIX_MB_COVERAGE --inputs $MUSIX_RECONSTRUCTION_INPUTS --baseline-report $MUSIX_MB_BASELINE_REPORT"
build-musicbrainz-seed-identities = "python scripts/run_genre_reconstruction_pipeline.py musicbrainz-input --coverage $MUSIX_MB_COVERAGE --seed-artifact $MUSIX_H2_SEED_ARTIFACT --output $MUSIX_MB_SEED_IDENTITIES"
extract-musicbrainz-seed-targets = "python scripts/extract_musicbrainz_seed_targets.py --archive $MUSIX_MB_ARTIST_ARCHIVE --seed-artifact $MUSIX_H2_SEED_ARTIFACT --output $MUSIX_MB_SEED_TARGET_ARTIFACT"
adapt-musicbrainz-seed-targets = "python scripts/adapt_musicbrainz_seed_targets.py --seed-target-artifact $MUSIX_MB_SEED_TARGET_ARTIFACT --reconciliation $MUSIX_SEED_RECONCILIATION_OUTPUT --model-input $MUSIX_PUBLIC_MODEL_INPUT --report $MUSIX_MB_SEED_TARGET_ADAPTER_REPORT"
build-musicbrainz-spotify-bridge = "python scripts/build_musicbrainz_spotify_bridge.py --archive $MUSIX_MB_ARTIST_ARCHIVE --historical-database $MUSIX_HISTORICAL_MEMBERSHIP_DATABASE --output $MUSIX_MB_SPOTIFY_BRIDGE_OUTPUT --object-store $MUSIX_MB_SPOTIFY_BRIDGE_OBJECT_STORE --receipt $MUSIX_MB_SPOTIFY_BRIDGE_RECEIPT"
