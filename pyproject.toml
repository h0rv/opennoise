[project]
name = "opennoise"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "essentia==2.1b6.dev1389",
    "igraph>=1.0.0",
    "implicit>=0.7.3",
    "jsonschema>=4.23,<5",
    "leidenalg>=0.12.0",
    "lxml==6.0.2",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.8.0",
    "umap-learn>=0.6.0",
]

[project.scripts]
on = "opennoise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
