[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opennoise"

[project]
name = "opennoise"
version = "0.1.0"
description = "OpenNoise: a local map of music genres and artists"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "zstandard>=0.25.0",
]

[project.scripts]
opennoise = "opennoise.serving.cli:main"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "ruff",
    "ty",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Ruff formatter controls trailing commas.
    "CPY001", # This personal project has no required copyright header.
    "D203",   # Incompatible with D211.
    "D213",   # Incompatible with D212.
    "EM101",  # Typed boundary errors keep their local, specific messages.
    "EM102",  # Typed boundary errors keep their local, specific messages.
    "ISC001", # Ruff formatter can conflict with the formatter.
    "TRY003", # Boundary context belongs at the raise site, not in generic exception classes.
]

[tool.ruff.lint.per-file-ignores]
"src/opennoise/ml/genre_neighborhoods/**" = [
    "E501", # Auditable SQLite statements retain their literal schema and query text.
    "PLR0913", # Sparse accumulator arguments are the explicit evidence dimensions.
    "PLR0917", # Sparse accumulator arguments are the explicit evidence dimensions.
    "PLR2004", # Public bounded-query maximum is intentionally local.
    "TC003", # Path annotations are Pydantic/runtime contract inputs.
    "TRY300", # Existing validated cache returns directly from its replay branch.
]
"scripts/build_genre_colisten_neighborhoods.py" = ["S607"]
"tests/**" = [
    "D100", # Test module names describe their scope.
    "D101", # Test case names describe their scope.
    "D102", # Test method names describe behavior.
    "PT009", # The project deliberately uses stdlib unittest, not pytest.
    "PT027", # The project deliberately uses stdlib unittest, not pytest.
    "S101", # Assertions are the test contract.
    "INP001", # Focused test directories need not be packages.
]
"src/opennoise/history/signals/model.py" = [
    "C901", # Numerical evaluation and sparse component assembly are intentionally cohesive.
    "PLR0915", # The evaluator keeps every oracle-only calculation in one auditable boundary.
]
"src/opennoise/ingest/musicbrainz/release_group_evidence.py" = [
    "A001", # Raw MusicBrainz artist-credit payload is named by its source field.
    "D101", # Evidence schema field names make the small models self-describing.
    "D103", # Hash helper is intentionally a direct companion to the receipt model.
    "E501", # SQL and source-provenance strings are kept intact for auditability.
    "PLR0913", # The build boundary receives its explicit sealed inputs.
    "PLR0917", # The build boundary receives its explicit sealed inputs.
    "PLR2004", # The SQLite batch size is an intentional local implementation detail.
    "TC001", # Runtime Pydantic annotations require these model imports.
    "TC003", # Iterator is part of the runtime generator signature.
    "TRY004", # Malformed external JSON is one normal parse failure class.
    "TRY301", # The bounded parser keeps rejection immediately beside the check.
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.poe]
executor = { type = "simple" }

[tool.poe.tasks]
sync = { cmd = "uv sync --locked", use_exec = true, env = { UV_CACHE_DIR = ".cache/uv" } }
bootstrap = { cmd = ".venv/bin/opennoise bootstrap-everynoise", use_exec = true }
check = { cmd = """
sh -ec '
set -e
.venv/bin/ruff format --check .
.venv/bin/ruff check .
.venv/bin/ty check
mkdir -p .cache/test-tmp
.venv/bin/python -m unittest discover -s tests -q
'
""", use_exec = true, env = { TMPDIR = ".cache/test-tmp", UV_CACHE_DIR = ".cache/uv" } }
dev = ".venv/bin/python scripts/run_dev.py"
build = { cmd = ".venv/bin/python scripts/certify_static_pages.py", use_exec = true }
deploy = { cmd = """
sh -ec '
set -e
.venv/bin/python scripts/certify_static_pages.py --sealed-deploy
wrangler pages deploy dist --project-name opennoise --branch main
'
""", use_exec = true, env = { WRANGLER_LOG_PATH = ".cache/wrangler-deploy.log" } }
