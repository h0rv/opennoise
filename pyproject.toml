[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[project]
name = "musix"
version = "0.1.0"
description = "A local map of music genres and artists"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "jinja2==3.1.6",
    "litestar==2.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "uvicorn==0.52.4",
    "zstandard>=0.25.0",
]

[project.scripts]
musix = "musix.cli:main"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "ruff",
    "ty",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Ruff formatter controls trailing commas.
    "CPY001", # This personal project has no required copyright header.
    "D203",   # Incompatible with D211.
    "D213",   # Incompatible with D212.
    "EM101",  # Typed boundary errors keep their local, specific messages.
    "EM102",  # Typed boundary errors keep their local, specific messages.
    "ISC001", # Ruff formatter can conflict with this rule.
    "TRY003", # Boundary context belongs at the raise site, not in generic exception classes.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D100", # Test module names describe their scope.
    "D101", # Test case names describe their scope.
    "D102", # Test method names describe behavior.
    "PT009", # The project deliberately uses stdlib unittest, not pytest.
    "PT027", # The project deliberately uses stdlib unittest, not pytest.
    "S101", # Assertions are the test contract.
]
"src/musix/routes.py" = [
    "PLR0913", # Route signatures list the public query parameters explicitly.
    "PLR0917", # Litestar injects route parameters by name rather than positional calls.
]
"src/musix/historical_signal_model.py" = [
    "C901", # Numerical evaluation and sparse component assembly are intentionally cohesive.
    "PLR0915", # The evaluator keeps every oracle-only calculation in one auditable boundary.
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "ty check"
"prepare-test-runtime" = "mkdir -p .cache/test-tmp .cache/uv"
test = { sequence = [
    "prepare-test-runtime",
    { cmd = "python -m unittest discover -s tests -v", env = { TMPDIR = ".cache/test-tmp", UV_CACHE_DIR = ".cache/uv" } },
] }
schema = "python -m unittest tests.test_schema -v"
"import" = "musix ingest"
bootstrap = "musix bootstrap-everynoise"
dev = "python scripts/run_dev.py"
dev-legacy = "musix serve"
evaluate-layout = "python scripts/evaluate_layout.py data/musix.sqlite --layout default"
evaluate-membership = "python scripts/evaluate_membership.py tests/fixtures/membership_evaluation.json"
ingest-musicbrainz-artists = "musix ingest-source musicbrainz_json_artist_20260829 --partition-prefix 0 --max-record-bytes 67108864"
ingest-musicbrainz-research = "musix ingest-source musicbrainz_json_artist_research_20260829 --partition-prefix 0 --max-record-bytes 67108864"
evaluate-musicbrainz-coverage = "python scripts/evaluate_musicbrainz_coverage.py --research-database .cache/musicbrainz-v3-research/musicbrainz-v3.sqlite --seed-database data/musix.sqlite --report .cache/musicbrainz-v3-research/coverage.json --inputs .cache/musicbrainz-v3-research/reconstruction-inputs.json --baseline-report .cache/musicbrainz-v3-research/baseline-report.json"
build-musicbrainz-research-graph = "python scripts/build_musicbrainz_research_graph.py build --coverage .cache/musicbrainz-v3-research/coverage-prefix0.json --reconstruction-inputs .cache/musicbrainz-v3-research/reconstruction-inputs-prefix0.json --research-database .cache/musicbrainz-v3-research/musicbrainz-v3.sqlite --output .cache/musicbrainz-v3-research/name-seed-research-graph-v1.json --gate-report .cache/musicbrainz-v3-research/name-seed-research-graph-v1.gate.json"
evaluate-musicbrainz-research-graph = "python scripts/build_musicbrainz_research_graph.py evaluate --graph .cache/musicbrainz-v3-research/name-seed-research-graph-v1.json --expected-graph-sha256 $MUSIX_MB_RESEARCH_GRAPH_SHA256 --historical-benchmark .cache/historical-signal-final/historical-signal-semantic-v1.json --output .cache/musicbrainz-v3-research/name-seed-research-graph-v1.evaluation.json"
ingest-musicbrainz-release-groups = "musix ingest-source musicbrainz_json_release_group_research_20260829 --partition-prefix 00 --max-archive-bytes 1250000000 --max-record-bytes 2097152 --checkpoint-every 1000"
ingest-musicbrainz-recordings = "musix ingest-source musicbrainz_json_recording_research_20260829 --partition-prefix 0 --max-archive-bytes 40000000 --max-record-bytes 2097152 --checkpoint-every 1000"
ingest-wikidata = "python scripts/ingest_wikidata.py"
enrich-wikidata-public-genres = "python scripts/ingest_wikidata.py --query config/wikidata_public_genres_20260831.rq --source-id wikidata_public_genres_20260831 --max-records 50000"
ingest-listenbrainz = "musix ingest-source listenbrainz_incremental_20260830 --max-archive-bytes 300000000 --max-records 6000000 --checkpoint-every 5000"
ingest-listenbrainz-joint = "python scripts/ingest_joint_listenbrainz.py"
build-public-model = "python scripts/build_public_model.py"
publish-public-model = "musix publish-public-model"
validate-public-graph = "python scripts/validate_public_graph.py"
evaluate-public-model-gate = "python scripts/evaluate_public_model_gate.py"
verify-phase3-release-manifest = "python scripts/verify_phase3_release_manifest.py"
ui-qa = "python scripts/render_ui_qa.py"
evaluate-production-map = "python scripts/evaluate_production_map.py"
build-historical-compatibility = "python scripts/build_historical_compatibility.py"
evaluate-historical-compatibility = "python scripts/evaluate_historical_compatibility.py"
build-historical-signal-model = "python scripts/build_historical_signal_model.py"
custody-historical-inputs = "python scripts/custody_historical_inputs.py --h3-source $MUSIX_HISTORICAL_H3_SOURCE --membership-database $MUSIX_HISTORICAL_MEMBERSHIP_DATABASE --object-store $MUSIX_HISTORICAL_OBJECT_STORE --receipt $MUSIX_HISTORICAL_CUSTODY_RECEIPT --h2-manifest $MUSIX_HISTORICAL_MANIFEST"
audit-historical-signal = "python scripts/audit_historical_signal.py"
publish-historical-signal-map = "python scripts/publish_historical_signal_map.py"
evaluate-historical-hierarchy = "python scripts/evaluate_historical_hierarchy.py"
evaluate-historical-hierarchy-gate = "python scripts/evaluate_historical_hierarchy_release_gate.py"
build-metadata-representatives = "python scripts/build_metadata_representatives.py $MUSIX_PUBLIC_DATABASE --output $MUSIX_METADATA_REPRESENTATIVES_OUTPUT"
publish-metadata-representatives = "python scripts/publish_metadata_representatives.py $MUSIX_METADATA_REPRESENTATIVES_ARTIFACT --object-store $MUSIX_METADATA_REPRESENTATIVES_OBJECT_STORE --output $MUSIX_METADATA_REPRESENTATIVES_RECEIPT"
build-genre-seed-universe = "musix build-genre-seed-universe --seed-artifact $MUSIX_H2_SEED_ARTIFACT --catalog-database $MUSIX_PUBLIC_DATABASE --output $MUSIX_GENRE_SEED_UNIVERSE_OUTPUT"

[tool.poe.tasks.historical-signal-release]
sequence = [
    { cmd = "python scripts/build_historical_signal_model.py --historical-manifest $MUSIX_HISTORICAL_MANIFEST --membership-database $MUSIX_HISTORICAL_MEMBERSHIP_DATABASE --h3-artifact-sha256 $MUSIX_HISTORICAL_H3_ARTIFACT_SHA256 --output $MUSIX_HISTORICAL_SIGNAL_ARTIFACT --report $MUSIX_HISTORICAL_SIGNAL_BUILD_REPORT" },
    { cmd = "python scripts/publish_historical_signal_map.py --signal-artifact $MUSIX_HISTORICAL_SIGNAL_ARTIFACT --compatibility-receipt $MUSIX_HISTORICAL_COMPATIBILITY_RECEIPT --output $MUSIX_HISTORICAL_SIGNAL_PUBLICATION --object-store $MUSIX_HISTORICAL_OBJECT_STORE --receipt $MUSIX_HISTORICAL_SIGNAL_RECEIPT --report $MUSIX_HISTORICAL_SIGNAL_PUBLISH_REPORT" },
]

[tool.poe.tasks.build-public-release]
sequence = [
    { cmd = "python scripts/build_public_release.py" },
    { cmd = "python scripts/build_production_map.py --database data/public.sqlite --source-model data/model/phase3-public-model.json --output data/model/production-map-v1.json" },
]


[tool.poe.tasks.release-certify]
cmd = "python scripts/release_certify.py"

[tool.poe.tasks.public-release-custody]
cmd = "python scripts/custody_public_release.py"

[tool.poe.tasks.check]
sequence = ["format-check", "lint", "typecheck", "test", "schema"]
