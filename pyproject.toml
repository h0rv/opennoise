[project]
name = "opennoise"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "igraph>=1.0.0",
    "implicit>=0.7.3",
    "leidenalg>=0.12.0",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.8.0",
]

[project.scripts]
on = "opennoise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "ty", "pytest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
