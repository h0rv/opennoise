[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opennoise"

[project]
name = "opennoise"
version = "0.1.0"
description = "OpenNoise: a local map of music genres and artists"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "jinja2==3.1.6",
    "litestar==2.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "uvicorn==0.52.4",
    "zstandard>=0.25.0",
]

[project.scripts]
opennoise = "opennoise.serving.cli:main"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "ruff",
    "ty",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Ruff formatter controls trailing commas.
    "CPY001", # This personal project has no required copyright header.
    "D203",   # Incompatible with D211.
    "D213",   # Incompatible with D212.
    "EM101",  # Typed boundary errors keep their local, specific messages.
    "EM102",  # Typed boundary errors keep their local, specific messages.
    "ISC001", # Ruff formatter can conflict with this rule.
    "TRY003", # Boundary context belongs at the raise site, not in generic exception classes.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D100", # Test module names describe their scope.
    "D101", # Test case names describe their scope.
    "D102", # Test method names describe behavior.
    "PT009", # The project deliberately uses stdlib unittest, not pytest.
    "PT027", # The project deliberately uses stdlib unittest, not pytest.
    "S101", # Assertions are the test contract.
]
"src/opennoise/serving/routes.py" = [
    "PLR0913", # Route signatures list the public query parameters explicitly.
    "PLR0917", # Litestar injects route parameters by name rather than positional calls.
]
"src/opennoise/history/signals/model.py" = [
    "C901", # Numerical evaluation and sparse component assembly are intentionally cohesive.
    "PLR0915", # The evaluator keeps every oracle-only calculation in one auditable boundary.
]
"src/opennoise/ingest/musicbrainz/release_group_evidence.py" = [
    "A001", # Raw MusicBrainz artist-credit payload is named by its source field.
    "D101", # Evidence schema field names make the small models self-describing.
    "D103", # Hash helper is intentionally a direct companion to the receipt model.
    "E501", # SQL and source-provenance strings are kept intact for auditability.
    "PLR0913", # The build boundary receives its explicit sealed inputs.
    "PLR0917", # The build boundary receives its explicit sealed inputs.
    "PLR2004", # The SQLite batch size is an intentional local implementation detail.
    "TC001", # Runtime Pydantic annotations require these model imports.
    "TC003", # Iterator is part of the runtime generator signature.
    "TRY004", # Malformed external JSON is one normal parse failure class.
    "TRY301", # The bounded parser keeps rejection immediately beside the check.
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.poe.tasks]
sync = "uv sync --locked"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "ty check"
"prepare-test-runtime" = "mkdir -p .cache/test-tmp .cache/uv"
test = { sequence = [
    "prepare-test-runtime",
    { cmd = "python -m unittest discover -s tests -v", env = { TMPDIR = ".cache/test-tmp", UV_CACHE_DIR = ".cache/uv" } },
] }
schema = "python -m unittest tests.test_schema -v"
"import" = "opennoise ingest"
bootstrap = "opennoise bootstrap-everynoise"
source-cache-status = "opennoise source-cache-status $OPENNOISE_SOURCE_CACHE_SOURCE_IDS"
acquire-source-cache = "opennoise acquire-source-cache $OPENNOISE_SOURCE_CACHE_SOURCE_IDS --object-store $OPENNOISE_SOURCE_CACHE_OBJECT_STORE --work-directory $OPENNOISE_SOURCE_CACHE_WORK_DIRECTORY --receipt $OPENNOISE_SOURCE_CACHE_RECEIPT"
cache-musicbrainz-release-group-20260905 = "opennoise acquire-source-cache musicbrainz_json_release_group_research_20260905 --object-store $OPENNOISE_MB_RELEASE_GROUP_CACHE_OBJECT_STORE --work-directory $OPENNOISE_MB_RELEASE_GROUP_CACHE_WORK_DIRECTORY --receipt $OPENNOISE_MB_RELEASE_GROUP_CACHE_RECEIPT --max-sources 1 --max-total-bytes 1200000000 --max-concurrency 1 --timeout-seconds 3600"
restore-source-cache = "opennoise restore-source-cache $OPENNOISE_SOURCE_CACHE_SOURCE_IDS --object-store $OPENNOISE_SOURCE_CACHE_OBJECT_STORE --receipt $OPENNOISE_SOURCE_CACHE_RECEIPT --destination $OPENNOISE_SOURCE_CACHE_DESTINATION"
dev = "python scripts/run_dev.py"
dev-research = "python -m scripts.run_local_research_dev"
export-opennoise-pages = "python scripts/export_opennoise_pages.py --production-map $OPENNOISE_PRODUCTION_MAP_PATH --open-construction-v2 $OPENNOISE_CONSTRUCTION_GRAPH_V2_PATH --output $OPENNOISE_PAGES_OUTPUT"
