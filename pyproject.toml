build-genre-containment-candidates = "python scripts/run_genre_reconstruction_pipeline.py containment --taxonomy-artifact $MUSIX_PUBLIC_TAXONOMY_EXPANSION_OUTPUT --reconstruction-inputs $MUSIX_RECONSTRUCTION_INPUTS --bridge $MUSIX_GENRE_CONTAINMENT_BRIDGE --output $MUSIX_GENRE_CONTAINMENT_OUTPUT --object-store $MUSIX_RECONSTRUCTION_OBJECT_STORE --receipt $MUSIX_GENRE_CONTAINMENT_RECEIPT"
