query = '''
SELECT DISTINCT ?genre ?genreLabel ?genreAltLabel ?parent ?parentLabel
                ?origin ?originLabel ?inception ?musicbrainzGenreId ?everyNoiseId
WHERE {
  ?genre wdt:P31/wdt:P279* wd:Q188451.
  OPTIONAL { ?genre wdt:P279 ?parent. }
  OPTIONAL { ?genre wdt:P495 ?origin. }
  OPTIONAL { ?genre wdt:P571 ?inception. }
  OPTIONAL { ?genre wdt:P8052 ?musicbrainzGenreId. }
  OPTIONAL { ?genre wdt:P9881 ?everyNoiseId. }
  SERVICE wikibase:label { bd:serviceParam wikibase:language "[AUTO_LANGUAGE],en". }
}
ORDER BY ?genre
'''
