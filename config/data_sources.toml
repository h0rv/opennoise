[evaluation]
seed = 20260830
unit = "canonical genre after alias resolution"
minimum_total_genres = 240
holdout_fraction = 0.20
split_group = "canonical genre and all aliases"
minimum_sources_per_ground_truth_edge = 2
allow_enao_as_only_ground_truth = false

[[evaluation.axes]]
name = "genre_family"
minimum_per_value = 12
values = ["electronic_dance", "ambient_experimental", "hip_hop_rap", "pop", "rock", "punk_metal", "rnb_soul_funk", "jazz_blues", "classical", "folk_traditional", "country", "latin_caribbean", "african", "south_asian", "east_southeast_asian", "religious_spoken_children"]

[[evaluation.axes]]
name = "region"
minimum_per_value = 10
values = ["north_america", "latin_america_caribbean", "uk_ireland", "western_northern_europe", "central_eastern_europe", "middle_east_north_africa", "west_central_africa", "east_southern_africa", "south_asia", "east_asia", "southeast_asia", "oceania", "transnational_internet"]

[[evaluation.axes]]
name = "era"
minimum_per_value = 20
values = ["pre_1950", "1950_1969", "1970_1989", "1990_2009", "2010_2019", "2020_present", "unknown"]

[[evaluation.slices]]
name = "head_mid_tail"
values = ["high_evidence", "medium_evidence", "low_evidence"]
minimum_per_value = 30

[[evaluation.slices]]
name = "language_and_script"
values = ["english_latin", "non_english_latin", "non_latin_script", "multiple_scripts"]
minimum_per_value = 20

[[evaluation.tasks]]
name = "search"
metrics = ["mrr_at_10", "recall_at_10", "zero_result_rate"]

[[evaluation.tasks]]
name = "genre_neighborhood"
metrics = ["precision_at_10", "recall_at_10", "source_agreement", "explanation_coverage"]

[[evaluation.tasks]]
name = "artist_retrieval"
metrics = ["mrr_at_20", "recall_at_20", "region_gap", "era_gap"]

[[evaluation.tasks]]
name = "map_layout"
metrics = ["trustworthiness_at_10", "continuity_at_10", "seed_stability", "component_coverage"]
