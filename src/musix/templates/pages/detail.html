<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ name }} — OpenNoise</title>
  <link rel="stylesheet" href="../assets/opennoise.css">
</head>
<body>
<main class="detail" data-map-status="mapped">
  <a class="back" href="../index.html">Map</a>
  <h1>{{ name }}</h1>
  {% if peers %}
  <section aria-label="Peers"><h2>Peers</h2><ul>{% for peer in peers %}<li><a href="{{ peer.href }}">{{ peer.name }}</a></li>{% endfor %}</ul></section>
  {% endif %}
</main>
</body>
</html>
