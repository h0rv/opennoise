{% for hit in hits %}
{% if hit.entity_kind == 'genre' %}
<a class="result" href="/genres/{{ hit.entity_id }}{% if search_query %}?q={{ search_query | urlencode }}{% endif %}"
   hx-get="/fragments/genres/{{ hit.entity_id }}" hx-target="#genre-detail-slot"
   hx-swap="innerHTML" hx-push-url="/genres/{{ hit.entity_id }}{% if search_query %}?q={{ search_query | urlencode }}{% endif %}"
   hx-sync="#search:abort">{{ hit.name }}</a>
{% endif %}
{% endfor %}
