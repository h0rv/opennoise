{% for hit in hits %}
{% if hit.entity_kind == 'genre' %}
<a class="result" href="/genres/{{ hit.entity_id }}?layout={{ layout_key }}{% if search_query %}&amp;q={{ search_query | urlencode }}{% endif %}"
   hx-get="/fragments/workspace?focus={{ hit.entity_id }}&amp;layout={{ layout_key }}{% if search_query %}&amp;q={{ search_query | urlencode }}{% endif %}" hx-target="#workspace"
   hx-swap="outerHTML" hx-push-url="/genres/{{ hit.entity_id }}?layout={{ layout_key }}{% if search_query %}&amp;q={{ search_query | urlencode }}{% endif %}"
   hx-sync="#search:abort">{{ hit.name }}</a>
{% endif %}
{% endfor %}
