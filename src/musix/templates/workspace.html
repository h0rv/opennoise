<section id="workspace">
{% include "map.html" %}
{% if genre %}
<a id="selection-clear" href="/" aria-label="Clear {{ genre.name }} selection"
   hx-get="/fragments/workspace" hx-target="#workspace" hx-swap="outerHTML"
   hx-push-url="/" hx-sync="#search:abort">×</a>
{% if genre.historical_representative or genre.defining_albums or genre.defining_tracks or genre.playable_links or genre.neighbors %}
{% include "genre_detail.html" %}
{% endif %}
{% endif %}
</section>
{% if clear_results %}<aside id="results" hx-swap-oob="innerHTML"></aside>{% endif %}
