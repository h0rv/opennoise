<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore relationships between music genres and artists.">
<title>Musix</title>
<link rel="stylesheet" href="/static/app.css?v=5">
<script src="/static/htmx-4.0.0.min.js" defer></script>
</head>
<body>
{% include "workspace.html" %}
<form id="search" role="search" action="/fragments/search" method="get">
<label class="sr-only" for="query">Artist or genre</label>
<input name="layout" type="hidden" value="{{ layout_key }}">
<input id="query" name="q" type="search" placeholder="Artist or genre" autocomplete="off"
       hx-get="/fragments/search" hx-trigger="input changed delay:160ms" hx-target="#results"
       hx-swap="innerHTML" hx-sync="this:replace">
</form>
<aside id="results" aria-label="Search results"></aside>
</body>
</html>
