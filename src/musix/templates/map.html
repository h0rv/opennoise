<main id="map" aria-label="Music map" tabindex="0"
      data-layout="{{ layout_key }}"{% if active_layout %} data-coordinate-kind="{{ active_layout.coordinate_space.coordinate_kind }}"{% endif %}>
<svg id="plot" role="img" aria-label="Genre and artist map"
     viewBox="{{ map.view_box }}" width="{{ map.view_width }}" height="{{ map.view_height }}"
     preserveAspectRatio="xMidYMid meet">
{% if map.points %}
  {% for point in map.points %}
  <a class="point {{ point.entity_kind }}{% if point.entity_id == map.focused_entity_id %} selected{% endif %}"
     href="{% if point.entity_kind == 'genre' %}/genres/{{ point.entity_id }}?layout={{ layout_key }}{% else %}/fragments/map?focus={{ point.entity_id }}&amp;layout={{ layout_key }}{% endif %}"
     aria-label="{{ point.name }}"
     {% if point.entity_kind == 'genre' %}aria-current="{% if point.entity_id == map.focused_entity_id %}true{% else %}false{% endif %}"
     hx-get="/fragments/workspace?focus={{ point.entity_id }}&amp;layout={{ layout_key }}" hx-target="#workspace"
     hx-swap="outerHTML" hx-push-url="/genres/{{ point.entity_id }}?layout={{ layout_key }}"
     hx-sync="#search:abort"{% endif %}>
    <circle cx="{{ point.x }}" cy="{{ point.y }}" r="3.5"
            fill="{{ point.color_hex or '#77776f' }}"></circle>
    {% if map.show_labels %}
    <text x="{{ point.x + 8 }}" y="{{ point.y + 3 }}">{{ point.name }}</text>
    {% endif %}
  </a>
  {% endfor %}
{% else %}
  <text x="50" y="50" class="empty" text-anchor="middle">∅</text>
{% endif %}
</svg>
</main>
