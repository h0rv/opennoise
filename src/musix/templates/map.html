<main id="map" aria-label="Music map">
<div id="semantic-map" role="application" aria-label="Interactive semantic music map"
     data-graph-url="/api/map" data-selected-genre="{{ map.focused_entity_id or '' }}"
     aria-describedby="map-pan-help"></div>
<svg id="plot" class="map-fallback" role="img" aria-label="Genre map. Enable JavaScript for the interactive map."
     viewBox="{% if production_graph %}0 0 1 1{% else %}{{ map.view_box }}{% endif %}" width="{{ map.view_width }}" height="{{ map.view_height }}"
     preserveAspectRatio="xMidYMid meet">
{% if production_graph %}
  {% for point in production_graph.graph.nodes %}
  <a id="map-point-{{ point.genre_id }}" class="point genre" data-genre-id="{{ point.genre_id }}"
     href="{{ production_graph.detail_hrefs[point.genre_id] }}" aria-label="{{ point.name }}, open details"
     hx-get="{{ production_graph.detail_hrefs[point.genre_id] }}" hx-target="#genre-detail-slot" hx-swap="innerHTML"
     hx-push-url="{{ production_graph.detail_hrefs[point.genre_id] }}" hx-sync="#search:abort">
    <title>{{ point.name }}</title>
    <circle cx="{{ point.x }}" cy="{{ point.y }}" r="0.0035" fill="#77776f"></circle>
    {% if point.lod_min == 0 and loop.index <= 36 %}
    <text x="{{ point.x + 0.006 }}" y="{{ point.y + 0.003 }}" font-size="0.012">{{ point.name }}</text>
    {% endif %}
  </a>
  {% endfor %}
{% elif map.points %}
  {% for point in map.points %}
  <a id="map-point-{{ point.entity_id }}" class="point {{ point.entity_kind }}{% if point.entity_id == map.focused_entity_id %} selected{% endif %}"
     data-genre-id="{{ point.entity_id }}"
     href="/genres/{{ point.entity_id }}{% if search_query %}?q={{ search_query | urlencode }}{% endif %}"
     aria-label="{{ point.name }}{% if point.entity_id == map.focused_entity_id %}, details open{% else %}, open details{% endif %}"
     {% if point.entity_id == map.focused_entity_id %}aria-current="location"{% endif %}
     hx-get="/fragments/genres/{{ point.entity_id }}" hx-target="#genre-detail-slot"
     hx-swap="innerHTML" hx-push-url="/genres/{{ point.entity_id }}{% if search_query %}?q={{ search_query | urlencode }}{% endif %}"
     hx-sync="#search:abort">
    <title>{{ point.name }}</title>
    <circle cx="{{ point.x }}" cy="{{ point.y }}" r="3.5"
            fill="{{ point.color_hex or '#77776f' }}"></circle>
    {% if map.show_labels %}
    <text class="{% if point.entity_id in map.label_entity_ids %}label-overview{% elif point.entity_id in map.detail_label_entity_ids %}label-detail{% else %}label-all{% endif %}"
          x="{% if point.x > map.horizontal_midpoint %}{{ point.x - 8 }}{% else %}{{ point.x + 8 }}{% endif %}"
          y="{{ point.y + 3 }}"{% if point.x > map.horizontal_midpoint %} text-anchor="end"{% endif %}>{{ point.name }}</text>
    {% endif %}
  </a>
  {% endfor %}
{% else %}
  <text x="50" y="50" class="empty" text-anchor="middle">∅</text>
{% endif %}
</svg>
<div id="map-controls" aria-label="Map controls">
  <button type="button" data-map-action="zoom-in" aria-label="Zoom in">+</button>
  <button type="button" data-map-action="zoom-out" aria-label="Zoom out">−</button>
  <button type="button" data-map-action="fit">Fit map</button>
  <label for="theme-select">Theme</label>
  <select id="theme-select" aria-label="Color theme">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
</div>
<p id="map-pan-help" class="sr-only">Drag or touch to pan. Use the mouse wheel or pinch to zoom. Use plus and minus to zoom, arrow keys to pan, and Escape to clear selection.</p>
<p id="map-status" class="sr-only" aria-live="polite"></p>
</main>
