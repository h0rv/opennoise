<main id="map" aria-label="Music map" data-map-view="open">
{% if local_research_map_configured %}
  <canvas id="semantic-map" role="img" aria-label="Local semantic music map"
          data-map-url="/api/local-research-map/renderer"
          data-neighbors-url="/api/local-research-map/neighbors/"
          {% if local_research_artist_evidence_configured %}data-artist-url="/fragments/local-research/musicbrainz/"{% endif %}
          data-focus="{{ local_research_focus or '' }}"></canvas>
  <nav id="map-controls" aria-label="Map controls">
    <button type="button" data-map-action="back" hidden>Back</button>
    <button type="button" data-map-action="fit">Fit</button>
    <button type="button" data-map-action="out" aria-label="Zoom out">−</button>
    <button type="button" data-map-action="in" aria-label="Zoom in">+</button>
    <button type="button" data-map-action="theme" aria-label="Toggle color theme">◐</button>
  </nav>
  <aside id="map-detail" aria-live="polite" hidden></aside>
{% else %}
  <p class="map-error">Semantic map unavailable.</p>
{% endif %}
</main>
