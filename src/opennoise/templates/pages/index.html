<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenNoise</title>
  <link rel="stylesheet" href="{{ asset_prefix }}assets/opennoise.css">
</head>
<body>
<main id="map" data-mapped-node-count="{{ mapped_node_count }}" data-searchable-name-count="{{ searchable_name_count }}">
  <form id="search" action="{{ asset_prefix }}search.html" role="search">
    <label class="sr-only" for="query">Search names</label>
    <input id="query" name="q" type="search" placeholder="Search" autocomplete="off">
  </form>
  <div id="map-stage" data-map-url="assets/map-data.json" aria-label="Genre map">{{ svg | safe }}</div>
  <nav id="map-controls" aria-label="Map controls">
    <button type="button" data-map-action="back" hidden>Back</button>
    <button type="button" data-map-action="fit">Fit</button>
    <button type="button" data-map-action="out" aria-label="Zoom out">−</button>
    <button type="button" data-map-action="in" aria-label="Zoom in">+</button>
  </nav>
  <aside id="map-detail" aria-live="polite" hidden></aside>
</main>
<script src="assets/map.js" defer></script>
</body>
</html>
