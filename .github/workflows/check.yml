name: Checks and production deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Clean-checkout poe check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Verify the browser executable used by contracts
        run: |
          test -x "$CHROMIUM_PATH"
          "$CHROMIUM_PATH" --version
      - name: Install locked project dependencies
        run: UV_CACHE_DIR=.cache/uv uv tool run --from poethepoet poe sync
      - name: Run required source checks with locked project Poe
        run: .venv/bin/poe check

  deploy:
    name: Certified production Pages deployment
    needs: check
    # main is both the repository default and the existing Pages production branch.
    # PRs, forks, manual runs and non-production branches never receive credentials.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'h0rv/opennoise' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opennoise-production-pages
      cancel-in-progress: false
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require canonical publication inputs
        run: |
          set -eu
          for input in data/public.sqlite .cache/semantic-map-layout-v3/artifact.json; do
            if [ ! -f "$input" ]; then
              echo "::error::Missing sealed publication input: $input. Deployment stopped; research/demo outputs cannot substitute."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Verify certification browser
        run: test -x "$CHROMIUM_PATH"
      - name: Install locked project dependencies
        run: UV_CACHE_DIR=.cache/uv uv tool run --from poethepoet poe sync
      - name: Install pinned Pages uploader
        run: npm install --global wrangler@4.102.0
      - name: Certify and deploy the approved release through Poe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Existing Pages deployment token unavailable; no credentials are created.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Existing Pages account ID unavailable.'; exit 1; }
          .venv/bin/poe deploy
