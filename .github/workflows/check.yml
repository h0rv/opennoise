name: Checks and production deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Clean-checkout poe check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Verify the browser executable used by contracts
        run: |
          test -x "$CHROMIUM_PATH"
          "$CHROMIUM_PATH" --version
      - name: Install locked project dependencies
        run: UV_CACHE_DIR=.cache/uv uv tool run --from poethepoet poe sync
      - name: Run required source checks with locked project Poe
        run: .venv/bin/poe check

  deploy:
    name: Certified production Pages deployment
    needs: [check, public-candidate]
    # main is both the repository default and the existing Pages production branch.
    # PRs, forks, manual runs and non-production branches never receive credentials.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'h0rv/opennoise' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opennoise-production-pages
      cancel-in-progress: false
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install Python 3.13
        run: uv python install 3.13.14
      - name: Verify certification browser
        run: test -x "$CHROMIUM_PATH"
      - name: Install locked project dependencies
        run: UV_CACHE_DIR=.cache/uv uv tool run --from poethepoet poe sync
      - name: Install pinned Pages uploader
        run: npm install --global wrangler@4.102.0
      - name: Certify the approved release without deployment credentials
        run: .venv/bin/poe build
      - name: Upload only the certified public release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Existing Pages deployment token unavailable; no credentials are created.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Existing Pages account ID unavailable.'; exit 1; }
          wrangler pages deploy dist --project-name opennoise --branch main
      - name: Verify the merged public release on the existing site
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: .venv/bin/python scripts/verify_public_catalog_live.py --commit "$EXPECTED_COMMIT"

  public-candidate:
    name: Reproduce and browser-check public-input candidate
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      PYTHONHASHSEED: '27'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install pinned Python
        run: uv python install 3.13.14
      - name: Install locked dependencies
        run: UV_CACHE_DIR=.cache/uv uv tool run --from poethepoet poe sync
      - name: Build fresh candidate from public input contract
        run: .venv/bin/python scripts/build_public_catalog_candidate.py build --output .cache/public-candidate
      - name: Independently replay and verify complete payload
        run: .venv/bin/python scripts/build_public_catalog_candidate.py verify --output .cache/public-candidate
      - name: Verify desktop and mobile candidate without publication
        run: |
          set -eu
          .venv/bin/poe dev --directory .cache/public-candidate/site --port 3001 >.cache/public-candidate-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 0.1
          done
          node scripts/capture_retained_catalog_demo.mjs http://127.0.0.1:3001 .cache/public-candidate-browser
      - name: Certify the promoted production build without uploading
        run: .venv/bin/poe build
