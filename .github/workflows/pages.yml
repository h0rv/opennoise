name: Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/opennoise/pages.py'
      - '.github/workflows/pages.yml'
env:
  CATALOG_RELEASE: 7822a8d03434-discogs-styles
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  queue: max
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$CATALOG_RELEASE" --jq .sha)
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          npm ci
          CATALOG_SOURCE_COMMIT="$commit" npm run build
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          gh release download "$CATALOG_RELEASE" --pattern "release-$CATALOG_RELEASE.tar.zst"
          tar --zstd -xf "release-$CATALOG_RELEASE.tar.zst"
          rm -rf web/dist/catalog
          python3 src/opennoise/pages.py release web/dist/catalog
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait for artifact visibility before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - uses: actions/deploy-pages@v4
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
